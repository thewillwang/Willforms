[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embody"
version = "0.0.1"
description = "Embody: cloud brain + software duck for the Embody embodied-AI project"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
audio = ["sounddevice>=0.5", "numpy>=1.26"]

[project.scripts]
embody-cloud = "embody.cloud.main:main"
embody-duck = "embody.sim.main:main"

[tool.setuptools.packages.find]
include = ["embody*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
